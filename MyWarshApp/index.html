<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warsh App</title>
    <style>
        /* 1. TAJWEED COLORS (CRITICAL) */
        .tj-ghunnah { color: #16a34a !important; }
        .tj-madd    { color: #ff0000 !important; }
        .tj-qalqalah{ color: #0000ff !important; }
        .tj-ra-heavy{ color: #00008B !important; font-weight: bold; }
        .tj-ra-light{ color: #0ea5e9 !important; }
        .tj-silent  { color: #999999 !important; }

        /* 2. LAYOUT */
        :root { --f: 32px; }
        body { font-family: 'Amiri', system-ui; background: #FFFEF7; color: #333; margin: 0; padding-bottom: 120px; }
        #quran { padding: 20px; direction: rtl; max-width: 800px; margin: 0 auto; line-height: 2.4; }
        .verse { font-size: var(--f); display: inline; cursor: pointer; padding: 2px 0; margin: 0 4px; }
        .verse:hover { background: #eee; }
        .verse.active { background: #ffeebb; box-shadow: 0 0 0 2px #eeca55; border-radius: 4px; }
        .num { font-size: 0.6em; color: brown; border: 1px solid brown; border-radius: 50%; padding: 0 5px; margin: 0 5px; }
        
        #controls { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 10px; border-top: 3px solid brown; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; z-index: 99; }
        input, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: brown; color: white; border: none; font-weight: bold; cursor: pointer; }
        #status { width: 100%; text-align: center; font-size: 12px; color: #555; }
    </style>

    <!-- LOAD ENGINE FIRST -->
    <script src="engine.js"></script>
</head>
<body>

    <div id="quran"><div style="text-align:center; margin-top:50px;">Loading...</div></div>

    <div id="controls">
        <input type="number" id="s" value="1" min="1" max="114" style="width:50px">
        <button onclick="load()">Go</button>
        <div style="width:10px"></div>
        <input type="number" id="start" value="1" style="width:50px">
        <input type="number" id="end" value="7" style="width:50px">
        <button onclick="play()">▶ Play</button>
        <button onclick="stop()" style="background:#555">Stop</button>
        
        <div style="display:flex; align-items:center; gap:5px">
            <label>Size:</label>
            <input type="range" min="20" max="80" value="32" oninput="document.documentElement.style.setProperty('--f', this.value+'px')">
        </div>
        <div id="status">Ready</div>
    </div>
    
    <audio id="player"></audio>

    <script>
        // VERIFIED AUDIO URL
        const baseUrl = "https://everyayah.com/data/warsh/warsh_ibrahim_aldosary_128kbps/";
        let isPlaying = false;
        let stopReq = false;

        async function load() {
            const id = document.getElementById('s').value;
            try {
                const res = await fetch('data/' + id + '.json');
                if(!res.ok) throw new Error("Surah not found. Check data folder.");
                const data = await res.json();
                
                let html = '<h2 style="text-align:center">Surah ' + data.name_ar + '</h2>';
                
                if(data.id !== 9) {
                    const bism = "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ";
                    // Apply engine to Bismillah
                    html += '<div style="text-align:center; margin-bottom:20px">' + apply(bism, detect(bism)) + '</div>';
                }
                
                data.verses.forEach((txt, i) => {
                    const n = i + 1;
                    // Apply engine to Verse
                    const content = apply(txt, detect(txt));
                    html += '<div class="verse" id="v'+n+'" onclick="pick('+n+')">' + content + ' <span class="num">' + n + '</span></div>';
                });
                document.getElementById('quran').innerHTML = html;
            } catch(e) { document.getElementById('quran').innerHTML = e.message; }
        }

        function pick(n) {
            document.getElementById('start').value = n;
            document.getElementById('end').value = n;
            hl(n);
        }

        function hl(n) {
            document.querySelectorAll('.active').forEach(e => e.classList.remove('active'));
            const el = document.getElementById('v'+n);
            if(el) { el.classList.add('active'); el.scrollIntoView({behavior:'smooth', block:'center'}); }
        }

        async function play() {
            if(isPlaying) return; isPlaying = true; stopReq = false;
            const s = document.getElementById('s').value.padStart(3, '0');
            const start = parseInt(document.getElementById('start').value);
            const end = parseInt(document.getElementById('end').value);
            const player = document.getElementById('player');
            const status = document.getElementById('status');

            for(let a=start; a<=end; a++) {
                if(stopReq) break;
                hl(a);
                status.innerText = 'Playing Ayah ' + a;
                player.src = baseUrl + s + String(a).padStart(3,'0') + '.mp3';
                
                try {
                    await new Promise(r => {
                        player.onended = r;
                        player.onerror = () => { console.log('Err', player.src); r(); };
                        player.play().catch(r);
                    });
                } catch(e) {}
                
                if(!stopReq) await new Promise(r => setTimeout(r, 500));
            }
            isPlaying = false; status.innerText = "Done";
        }

        function stop() { stopReq = true; document.getElementById('player').pause(); isPlaying = false; }
        
        // Auto Load
        load();
    </script>
</body>
</html>
