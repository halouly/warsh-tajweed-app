<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warsh Master App</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* WARSH TAJWEED PALETTE */
        .tj-ghunnah { color: #16a34a !important; } /* Green */
        .tj-madd    { color: #dc2626 !important; } /* Red */
        .tj-qalqalah{ color: #0284c7 !important; } /* Blue */
        .tj-heavy   { color: #1e3a8a !important; font-weight: bold; } /* Dark Blue (Heavy Lam/Ra) */
        .tj-light   { color: #06b6d4 !important; } /* Cyan (Light Ra) */
        .tj-special { color: #d97706 !important; font-weight: bold; } /* ORANGE: Tasshil/Naql Dots */
        .tj-silent  { color: #9ca3af !important; } /* Gray */

        /* UI */
        :root { --sz: 32px; }
        body { font-family: 'Amiri', serif; background: #fffcf2; color: #1f2937; margin:0; padding-bottom:150px; }
        #display { padding: 30px 20px; max-width: 900px; margin: 0 auto; line-height: 2.8; text-align: justify; }
        
        .verse { display: inline; font-size: var(--sz); cursor: pointer; padding: 4px 0; border-bottom: 1px dashed #e5e5e5; }
        .verse:hover { background: #f9f9f9; }
        .verse.active { background: #fef3c7; box-shadow: 0 0 0 4px #fef3c7; border-radius: 6px; }
        .num { font-size: 0.55em; color: #92400e; border: 1px solid #92400e; border-radius: 50%; padding: 0 6px; margin: 0 5px; vertical-align: middle; user-select: none; }

        #panel {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #fff; border-top: 4px solid #92400e;
            padding: 15px; z-index: 1000; direction: ltr;
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.05);
        }
        input, button { padding: 10px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 6px; }
        button { background: #92400e; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #78350f; }
    </style>
</head>
<body>

    <div id="display" style="text-align:center; padding-top:100px; color:#888;">Loading Warsh Data...</div>

    <div id="panel">
        <input type="number" id="s" value="1" min="1" max="114" style="width:60px" placeholder="Surah">
        <button onclick="load()">Go</button>
        <div style="width:1px; background:#e5e7eb; margin:0 5px;"></div>
        <button onclick="play()">▶ PLAY</button>
        <button onclick="stop()" style="background:#4b5563">STOP</button>
        <div style="display:flex; align-items:center; gap:8px; margin-left:10px;">
            <span style="font-size:12px; color:#666">SIZE</span>
            <input type="range" min="24" max="64" value="32" oninput="document.documentElement.style.setProperty('--sz', this.value+'px')">
        </div>
        <input type="hidden" id="v_start" value="1"><input type="hidden" id="v_end" value="1">
        <div id="status" style="width:100%; text-align:center; font-size:12px; color:#6b7280; margin-top:5px;">Ready</div>
    </div>

    <script>
    // === 1. WARSH ENGINE ===
    const SUKUN='\u0652', SHADDA='\u0651', FATHA='\u064E', DAMMA='\u064F', KASRA='\u0650';
    const DAGGER='\u0670', MADD_SIGN='\u0653', WARSH_DOT='\u06EC'; // The special dot
    
    // Letters
    const QALQ='قطبجد', IDGH_GH='ينمو', IDGH_NO='لر', IKHFA='تثجدذزسشصضطظفقك';
    const MADD='اوى'+DAGGER, HAMZA='ءأإؤئ';
    const HEAVY_LAM_TRIGGERS = 'صطظ'; 

    function isDiac(c){const x=c.charCodeAt(0); return (x>=0x064B && x<=0x065F) || x===0x0670 || (x>=0x06D6 && x<=0x06ED);}
    function isLtr(c){const x=c.charCodeAt(0); return !isDiac(c) && x>=0x0600 && x<=0x06FF;}
    function getDiac(t,i){let d=[]; for(let j=i+1;j<t.length&&isDiac(t[j]);j++)d.push(t[j]); return d;}
    function has(t,i,c){return getDiac(t,i).includes(c);}
    function getEnd(t, i){let j=i+1; while(j<t.length&&isDiac(t[j]))j++; return j;}
    function nextL(t,i){for(let j=i+1;j<t.length;j++)if(isLtr(t[j]))return{c:t[j],i:j}; return null;}
    function prevL(t,i){for(let j=i-1;j>=0;j--)if(isLtr(t[j]))return{c:t[j],i:j}; return null;}

    function detect(t){
        const a=[];
        for(let i=0;i<t.length;i++){
            const c=t[i];
            if(!isLtr(c)) continue;
            
            const n=nextL(t,i), p=prevL(t,i);
            const rangeEnd = getEnd(t, i);
            const diacs = getDiac(t,i);
            
            const isSakin = has(t,i,SUKUN) || (!diacs.length && n && !has(t,i,SHADDA)); 
            const hasVowel = has(t,i,FATHA) || has(t,i,DAMMA) || has(t,i,KASRA);
            const isShadda = has(t,i,SHADDA);

            let rule = null;

            // --- 0. SPECIAL WARSH MARKERS (Tasshil/Naql) ---
            // If the letter carries the special dot (U+06EC), color it ORANGE
            if (has(t, i, WARSH_DOT) || has(t, i, '\u065F')) {
                rule = 'tj-special';
            }

            // --- 1. GHUNNAH ---
            else if((c==='ن'||c==='م') && isShadda) rule = 'tj-ghunnah';
            else if(c==='ن' && isSakin && n){
                if(IDGH_GH.includes(n.c) || n.c==='ب' || IKHFA.includes(n.c)) rule = 'tj-ghunnah';
                else if(IDGH_NO.includes(n.c)) rule = 'tj-silent';
            }
            else if(c==='م' && isSakin && n && n.c==='ب') rule = 'tj-ghunnah';

            // --- 2. QALQALAH ---
            else if(QALQ.includes(c) && (has(t,i,SUKUN) || (!hasVowel && !n))) rule = 'tj-qalqalah';

            // --- 3. HEAVY LAM ---
            else if(c==='ل' && has(t,i,FATHA) && p && HEAVY_LAM_TRIGGERS.includes(p.c) && (has(t,p.i,FATHA)||has(t,p.i,SUKUN)||!getDiac(t,p.i).length)){
                rule = 'tj-heavy';
            }

            // --- 4. WARSH RA ---
            else if(c==='ر'){
                if(has(t,i,FATHA) || has(t,i,DAMMA)) rule = 'tj-heavy';
                if(has(t,i,KASRA)) rule = 'tj-light'; 
                else if((has(t,i,FATHA) || has(t,i,DAMMA)) && p){
                    if(has(t,p.i,KASRA) || (p.c==='ي' && (has(t,p.i,SUKUN)||!getDiac(t,p.i).length))) rule = 'tj-light';
                }
            }

            // --- 5. MADD (Including Badal) ---
            else if(MADD.includes(c) && !hasVowel && !isShadda){
                // A. Normal/Strong Madd
                if(has(t,i,MADD_SIGN) || (n && (has(t,n.i,SHADDA) || has(t,n.i,SUKUN)))) rule = 'tj-madd';
                // B. BADAL MADD (Hamza before Madd) - Warsh Special
                else if(p && HAMZA.includes(p.c)) rule = 'tj-madd';
                // C. Natural Madd
                else rule = 'tj-madd';
            }
            
            // --- 6. SILENT ---
            else if(c==='ل' && isSakin && n && has(t,n.i,SHADDA)) rule = 'tj-silent';

            if(rule) a.push({s:i, e:rangeEnd, cls:rule});
        }
        return a;
    }

    function apply(t,ann){
        const m=new Map();
        for(const x of ann) for(let i=x.s;i<x.e;i++) m.set(i,x);
        let h='',cls=null,open=false;
        for(let i=0;i<t.length;i++){
            const x=m.get(i),nc=x?x.cls:null;
            if(nc!==cls){
                if(open)h+='</span>';
                if(nc){h+=`<span class="${nc}">`;open=true}
                else open=false;
                cls=nc;
            }
            h+=t[i];
        }
        if(open)h+='</span>';
        return h;
    }

    // === 2. APP LOGIC ===
    const BASE = "https://everyayah.com/data/warsh/warsh_ibrahim_aldosary_128kbps/";
    const aud = new Audio();
    let playing=false, stopReq=false;

    async function load() {
        const s = document.getElementById('s').value;
        const div = document.getElementById('display');
        try {
            const res = await fetch('data/' + s + '.json');
            if(!res.ok) throw new Error("Data missing for Surah "+s);
            const data = await res.json();
            
            let html = `<h2 style="margin-bottom:30px">Surah ${data.name_ar}</h2>`;
            if (s != 1 && s != 9) {
                const bism = "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ";
                html += `<div style="text-align:center; margin-bottom:20px; font-size:0.9em">${apply(bism, detect(bism))}</div>`;
            }

            data.verses.forEach((txt, i) => {
                const n = i + 1;
                html += `<div class="verse" id="v${n}" onclick="pick(${n})">${apply(txt, detect(txt))} <span class="num">${n}</span></div>`;
            });
            div.innerHTML = html;
            document.getElementById('v_start').value = 1;
            document.getElementById('v_end').value = data.verses.length;
        } catch(e) {
            div.innerHTML = `<div style="color:#d62222; margin-top:50px">Error: ${e.message}</div>`;
        }
    }

    function pick(n) { document.getElementById('v_start').value=n; document.getElementById('v_end').value=n; hl(n); }
    function hl(n) { document.querySelectorAll('.active').forEach(e=>e.classList.remove('active')); const el=document.getElementById('v'+n); if(el){el.classList.add('active'); el.scrollIntoView({behavior:'smooth',block:'center'});}}
    async function play() {
        if(playing) return; playing=true; stopReq=false;
        const s = document.getElementById('s').value.padStart(3,'0');
        const start = parseInt(document.getElementById('v_start').value);
        const end = parseInt(document.getElementById('v_end').value);
        const st = document.getElementById('status');
        for(let a=start; a<=end; a++) {
            if(stopReq) break;
            hl(a); st.innerText=`Playing Ayah ${a}...`;
            aud.src = `${BASE}${s}${String(a).padStart(3,'0')}.mp3`;
            try { await new Promise(r=>{aud.onended=r; aud.onerror=r; aud.play().catch(r);}); } catch(e){}
            if(!stopReq) await new Promise(r=>setTimeout(r, 400));
        }
        playing=false; st.innerText="Ready";
    }
    function stop() { stopReq=true; aud.pause(); playing=false; document.getElementById('status').innerText="Stopped"; }
    load();
    </script>
</body>
</html>
